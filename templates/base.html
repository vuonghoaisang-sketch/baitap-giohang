<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Nhà sách Sông Hương{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script defer src="{{ url_for('static', filename='shop.js') }}"></script>
</head>
<body>
{% block layout %}
<header class="site-header">
  <nav class="container d-flex flex-wrap gap-3 align-items-center py-3" aria-label="Điều hướng chính">
    <a class="fw-bold me-auto" href="{{ url_for('shop.books') }}">Nhà sách Sông Hương</a>
    <a href="{{ url_for('shop.books') }}">Sách</a>
    <a href="{{ url_for('shop.show_cart') }}">Giỏ hàng <span class="badge rounded-pill cart-badge">{{ cart_count }}</span></a>
  </nav>
</header>
<main class="container py-4">
  {% include 'flashes.html' %}
  {% block content %}{% endblock %}
</main>
{% endblock %}
</body>
</html>
